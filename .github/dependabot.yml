# Weekly, grouped updates into dev. Majors arrive as separate PRs; minor and patch bumps are grouped.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]

  - package-ecosystem: uv
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directories: [/frontend, /infra/firebase]
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, frontend]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /infra/firebase]
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, docker]
