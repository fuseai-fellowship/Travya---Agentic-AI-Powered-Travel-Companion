name: Bug report
description: Something does not work as documented.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Hosted app
        - Local (docker compose)
        - Local (backend or frontend run directly)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.2.0 or a commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, keys and personal data first.
      render: text
