name: docs

# Builds the MkDocs site with --strict (broken links, anchors and missing pages fail the build) and
# publishes it to Cloudflare Pages (project travya-docs) from main. GitHub Pages is disabled for the
# organisation. The deploy job is skipped until CF_ACCOUNT_ID and CLOUDFLARE_API_TOKEN exist.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    name: Build (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install MkDocs Material
        run: pip install --no-deps --require-hashes -r docs/requirements.txt
      - name: Build the site
        run: mkdocs build --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: docs-site
          path: site
          retention-days: 7

  deploy:
    name: Deploy (Cloudflare Pages)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CF_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs
      url: https://travya-docs.pages.dev
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site
      - name: Publish
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CF_ACCOUNT_ID }}
          wranglerVersion: "4.157.0"
          command: pages deploy site --project-name=travya-docs --branch=main --commit-hash=${{ github.sha }}
