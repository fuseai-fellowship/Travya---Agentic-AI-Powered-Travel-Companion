# SPA server for the production-like image (compose and e2e). Production itself is served by
# Cloudflare Pages with the same headers from public/_headers.
# Rendered by the nginx entrypoint through envsubst; only ${API_ORIGIN} and ${AUTH_EMULATOR_ORIGIN} are replaced.

map $uri $travya_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Declared once at server level: a location-level add_header would silently drop all of these.
    add_header Cache-Control $travya_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://plus.unsplash.com https://upload.wikimedia.org https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://tiles.openfreemap.org https://lh3.googleusercontent.com; font-src 'self' data:; connect-src 'self' ${API_ORIGIN} ${AUTH_EMULATOR_ORIGIN} https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://tiles.openfreemap.org https://tile.openstreetmap.org; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; worker-src 'self' blob:; child-src blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Cloudflare Pages config files ride along in dist/; nothing to serve here.
    location ~ ^/_(headers|redirects)$ {
        return 404;
    }

    # Hashed build output: a miss is a real 404, never the SPA shell.
    location /assets/ {
        try_files $uri =404;
    }

    # History-API routing: unknown paths get index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
