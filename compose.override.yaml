# Development overrides, applied automatically by `docker compose up`:
# dev image targets, source mounts with hot reload, ports published on 127.0.0.1 only.
services:
  db:
    # 5433 on the host: a native Postgres may already own 5432.
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  auth:
    ports:
      - "127.0.0.1:9099:9099"

  migrate:
    build:
      target: dev
    image: travya-api:dev
    volumes:
      - ./backend:/app

  api:
    build:
      target: dev
    image: travya-api:dev
    environment:
      LOCAL_STORAGE_DIR: /app/.storage
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      target: dev
    image: travya-web:dev
    # Read by the Vite dev server at start; the browser runs on the host, so addresses are localhost.
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-travya.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-travya
      VITE_FIREBASE_AUTH_EMULATOR_URL: http://localhost:9099
    volumes:
      - ./frontend:/app
      # Keep the Linux node_modules from the image instead of the host's.
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
